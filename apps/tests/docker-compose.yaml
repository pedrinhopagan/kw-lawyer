# Sem nome próprio o compose chama o projeto de "tests", o nome da pasta, e qualquer outro repositório
# com uma pasta assim compartilha os containers: um `db:down` aqui derruba o banco de teste do vizinho.
name: kw-lawyer-tests

services:
  db_test:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: lawyer_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5445:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lawyer_test"]
      interval: 2s
      timeout: 5s
      retries: 10
