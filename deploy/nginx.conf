server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: /entrar, /login, /agenda e /processos/<cnj> não existem em disco.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker cacheado é service worker velho sobrevivendo ao deploy: o navegador nunca
    # buscaria a versão nova e o app instalado no celular congelaria na build anterior.
    # Sem `expires`: a diretiva emitiria um Cache-Control próprio e o header sairia duplicado.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { }
        default_type application/manifest+json;
    }

    location /icons/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
